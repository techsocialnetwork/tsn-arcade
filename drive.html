<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSN Drive - 3D Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
#gameCanvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;width:100%;padding:20px;color:#fff;pointer-events:none;z-index:10}
#speedometer{position:fixed;bottom:30px;right:30px;text-align:right}
#speed{font-size:4rem;font-weight:bold;color:#0f0;text-shadow:0 0 20px rgba(0,255,0,0.5)}
#speedLabel{font-size:1rem;color:#888}
#score{position:fixed;top:30px;left:30px;font-size:1.5rem}
#controls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:#888;font-size:0.9rem}
#gameOver{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;display:none;background:rgba(0,0,0,0.9);padding:40px;border-radius:20px;border:2px solid #f44}
#gameOver h2{font-size:3rem;color:#f44;margin-bottom:20px}
#restartBtn{margin-top:20px;padding:15px 40px;font-size:1.2rem;background:#f44;color:#fff;border:none;border-radius:10px;cursor:pointer;pointer-events:all}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
<div id="score">Score: <span id="scoreValue">0</span></div>
<div id="speedometer"><div id="speed">0</div><div id="speedLabel">MPH</div></div>
<div id="controls">Arrow keys to drive | R = Restart</div>
</div>
<div id="gameOver"><h2>CRASH!</h2><p>Final Score: <span id="finalScore">0</span></p><button id="restartBtn" onclick="restartGame()">RESTART</button></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const canvas=document.getElementById('gameCanvas');

// Scene
const scene=new THREE.Scene();
const fogColor=new THREE.Color(0x1a0033);
scene.fog=new THREE.Fog(fogColor,20,180);
scene.background=fogColor;

// Camera
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,4,8);
camera.lookAt(0,0,-20);

// Renderer
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

// Lights
const ambient=new THREE.AmbientLight(0xffaa00,0.3);
scene.add(ambient);

const sun=new THREE.DirectionalLight(0xff6600,1.5);
sun.position.set(30,20,-80);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
sun.shadow.camera.near=0.5;
sun.shadow.camera.far=200;
sun.shadow.camera.left=-50;
sun.shadow.camera.right=50;
sun.shadow.camera.top=50;
sun.shadow.camera.bottom=-50;
scene.add(sun);

// Sunset sky dome
const skyGeo=new THREE.SphereGeometry(400,32,32);
const skyMat=new THREE.ShaderMaterial({
uniforms:{topColor:{value:new THREE.Color(0x0a0014)},bottomColor:{value:new THREE.Color(0xff6600)},offset:{value:33},exponent:{value:0.6}},
vertexShader:`varying vec3 vWorldPosition;void main(){vec4 worldPosition=modelMatrix*vec4(position,1.0);vWorldPosition=worldPosition.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
fragmentShader:`uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;varying vec3 vWorldPosition;void main(){float h=normalize(vWorldPosition+offset).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0);}`,
side:THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

// Sun visual
const sunGeo=new THREE.SphereGeometry(8,32,32);
const sunMat=new THREE.MeshBasicMaterial({color:0xffaa00});
const sunMesh=new THREE.Mesh(sunGeo,sunMat);
sunMesh.position.set(30,8,-120);
scene.add(sunMesh);

// Ground
const groundGeo=new THREE.PlaneGeometry(500,500);
const groundMat=new THREE.MeshLambertMaterial({color:0x1a0a05});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
ground.receiveShadow=true;
scene.add(ground);

// Road
const roadGeo=new THREE.PlaneGeometry(16,500);
const roadMat=new THREE.MeshLambertMaterial({color:0x222222});
const road=new THREE.Mesh(roadGeo,roadMat);
road.rotation.x=-Math.PI/2;
road.receiveShadow=true;
scene.add(road);

// Road markings
const markings=[];
for(let i=0;i<30;i++){
const mGeo=new THREE.PlaneGeometry(0.3,4);
const mMat=new THREE.MeshBasicMaterial({color:0xffffff});
const m=new THREE.Mesh(mGeo,mMat);
m.rotation.x=-Math.PI/2;
m.position.y=0.01;
m.position.z=-i*18;
scene.add(m);
markings.push(m);
}

// Mountains
for(let i=0;i<40;i++){
const h=5+Math.random()*15;
const w=8+Math.random()*20;
const mtGeo=new THREE.ConeGeometry(w,h,4);
const mtMat=new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(0.75,0.2,0.1+Math.random()*0.1)});
const mt=new THREE.Mesh(mtGeo,mtMat);
mt.position.set((Math.random()-0.5)*180,-0.5,-30-Math.random()*150);
scene.add(mt);
}

// Player car
function makeCar(color,headlights=false){
const car=new THREE.Group();

const bodyGeo=new THREE.BoxGeometry(1.8,0.6,3.5);
const bodyMat=new THREE.MeshStandardMaterial({color:color,metalness:0.6,roughness:0.3});
const body=new THREE.Mesh(bodyGeo,bodyMat);
body.position.y=0.6;
body.castShadow=true;
car.add(body);

const cabinGeo=new THREE.BoxGeometry(1.4,0.5,1.8);
const cabinMat=new THREE.MeshStandardMaterial({color:0x111111,metalness:0.8,roughness:0.2});
const cabin=new THREE.Mesh(cabinGeo,cabinMat);
cabin.position.y=1.1;
cabin.position.z=-0.2;
cabin.castShadow=true;
car.add(cabin);

const wheelGeo=new THREE.CylinderGeometry(0.35,0.35,0.3,16);
const wheelMat=new THREE.MeshStandardMaterial({color:0x111111});
const positions=[[-0.9,0.35,1.1],[0.9,0.35,1.1],[-0.9,0.35,-1.1],[0.9,0.35,-1.1]];
positions.forEach(p=>{
const w=new THREE.Mesh(wheelGeo,wheelMat);
w.rotation.z=Math.PI/2;
w.position.set(...p);
w.castShadow=true;
car.add(w);
});

if(headlights){
const lightGeo=new THREE.SphereGeometry(0.15,8,8);
const lightMat=new THREE.MeshBasicMaterial({color:0xffffaa});
const l1=new THREE.Mesh(lightGeo,lightMat);
l1.position.set(-0.6,0.6,1.75);
car.add(l1);
const l2=new THREE.Mesh(lightGeo,lightMat);
l2.position.set(0.6,0.6,1.75);
car.add(l2);

const spot=new THREE.SpotLight(0xffffaa,2,40,0.5,0.5,1);
spot.position.set(0,1,2);
spot.target.position.set(0,0,10);
car.add(spot);
car.add(spot.target);
}

return car;
}

const player=makeCar(0xff3333,true);
player.position.set(0,0,0);
scene.add(player);

// Traffic
let traffic=[];
const trafficColors=[0x4488ff,0xffaa00,0xff44ff,0x44ff88,0xffffff,0xff6666];
function spawnTraffic(){
const lane=(Math.floor(Math.random()*3)-1)*5;
const car=makeCar(trafficColors[Math.floor(Math.random()*trafficColors.length)],false);
car.position.set(lane,0,-80-Math.random()*40);
car.userData.speed=40+Math.random()*50;
scene.add(car);
traffic.push(car);
}

// Game state
let gameRunning=true;
let score=0;
let speed=0;
let maxSpeed=180;
let roadCurve=0;
let curveTarget=0;
let dist=0;
const keys={};

window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='r'||e.key==='R')restartGame();});
window.addEventListener('keyup',e=>keys[e.key]=false);
window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

function update(dt){
if(!gameRunning)return;

// Speed
if(keys['ArrowUp']||keys['w']||keys['W'])speed+=40*dt;
else if(keys['ArrowDown']||keys['s']||keys['S'])speed-=80*dt;
else speed-=20*dt;
speed=Math.max(0,Math.min(speed,maxSpeed));

// Steering
let steer=0;
if(speed>5){
if(keys['ArrowLeft']||keys['a']||keys['A']){player.position.x-=15*dt;steer=0.15;}
if(keys['ArrowRight']||keys['d']||keys['D']){player.position.x+=15*dt;steer=-0.15;}
}
player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,steer,0.1);
player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,steer*0.5,0.05);

// Boundaries
player.position.x=Math.max(-7,Math.min(7,player.position.x));

// Move world
const move=speed*dt;
dist+=move;
roadCurve+=(curveTarget-roadCurve)*0.02;
curveTarget=Math.sin(dist*0.01)*2;

// Move road markings
markings.forEach(m=>{
m.position.z+=move;
if(m.position.z>10)m.position.z-=540;
});

// Move mountains to create endless feel
scene.children.forEach(c=>{
if(c.geometry&&c.geometry.type==='ConeGeometry'){
c.position.z+=move*0.8;
if(c.position.z>10){
c.position.z-=150;
c.position.x=(Math.random()-0.5)*180;
}
}
});

// Spawn traffic
if(Math.random()<0.015*speed/maxSpeed)spawnTraffic();

// Update traffic
for(let i=traffic.length-1;i>=0;i--){
const car=traffic[i];
car.position.z+=move-car.userData.speed*dt;

if(car.position.z>10){
scene.remove(car);
traffic.splice(i,1);
score+=Math.floor(speed/10);
continue;
}

// Collision
if(Math.abs(player.position.x-car.position.x)<1.8&&Math.abs(player.position.z-car.position.z)<3){
gameOver();
}
}

score+=Math.floor(speed/50);
document.getElementById('speed').textContent=Math.floor(speed);
document.getElementById('scoreValue').textContent=score;

// Camera follow
const targetX=player.position.x*0.4+roadCurve*2;
camera.position.x=THREE.MathUtils.lerp(camera.position.x,targetX,0.05);
camera.position.z=player.position.z+8;
camera.lookAt(player.position.x*0.3,0,player.position.z-20);

// Road follows player visually
road.position.z=player.position.z-50;
}

function gameOver(){
gameRunning=false;
document.getElementById('finalScore').textContent=score;
document.getElementById('gameOver').style.display='block';
}

function restartGame(){
gameRunning=true;score=0;speed=0;dist=0;roadCurve=0;curveTarget=0;
player.position.set(0,0,0);player.rotation.set(0,0,0);
traffic.forEach(c=>scene.remove(c));traffic=[];
document.getElementById('gameOver').style.display='none';
}
window.restartGame=restartGame;

const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
update(clock.getDelta());
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
