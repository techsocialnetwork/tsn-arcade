<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSNBot Drive - 3D Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        #speedometer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            text-align: right;
        }

        #speed {
            font-size: 4rem;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        #speedLabel {
            font-size: 1rem;
            color: #888;
        }

        #score {
            position: fixed;
            top: 30px;
            left: 30px;
            font-size: 1.5rem;
            color: #fff;
        }

        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #888;
            font-size: 0.9rem;
        }

        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff4444;
        }

        #gameOver h2 {
            font-size: 3rem;
            color: #ff4444;
            margin-bottom: 20px;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: all;
        }

        #restartBtn:hover {
            background: #ff6666;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="score">Score: <span id="scoreValue">0</span></div>
        <div id="speedometer">
            <div id="speed">0</div>
            <div id="speedLabel">MPH</div>
        </div>
        <div id="controls">
            ← → Arrow keys to steer | ↑ Accelerate | ↓ Brake
        </div>
    </div>

    <div id="gameOver">
        <h2>CRASH!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn" onclick="restartGame()">RESTART</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game state
        let gameRunning = true;
        let score = 0;
        let speed = 0;
        let maxSpeed = 200;
        let acceleration = 0.5;
        let deceleration = 0.3;
        let brakeForce = 1;
        let roadWidth = 400;
        let laneCount = 4;
        let laneWidth = roadWidth / laneCount;

        // Player car
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            width: 50,
            height: 80,
            lane: 1,
            steering: 0,
            color: '#ff3333'
        };

        // Road
        let roadOffset = 0;
        let roadSegments = [];
        const segmentLength = 50;
        const drawDistance = 100;

        // Traffic
        let traffic = [];
        let trafficSpawnTimer = 0;

        // Input
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 150;
        });

        function initRoad() {
            roadSegments = [];
            for (let i = 0; i < drawDistance; i++) {
                roadSegments.push({
                    z: i * segmentLength,
                    curve: Math.sin(i * 0.05) * 200,
                    y: 0
                });
            }
        }

        function spawnTraffic() {
            const lanes = [0, 1, 2, 3];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const colors = ['#4488ff', '#ffaa00', '#ff44ff', '#44ff88', '#ffffff'];
            
            traffic.push({
                x: (canvas.width / 2) + (lane - 1.5) * laneWidth,
                y: -100,
                width: 50,
                height: 80,
                speed: 30 + Math.random() * 50,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function update() {
            if (!gameRunning) return;

            // Acceleration / braking
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                speed += acceleration;
            } else if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                speed -= brakeForce;
            } else {
                speed -= deceleration;
            }

            speed = Math.max(0, Math.min(speed, maxSpeed));

            // Steering
            if (speed > 0) {
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                    player.x -= 5;
                }
                if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                    player.x += 5;
                }
            }

            // Keep player on road
            const roadLeft = (canvas.width - roadWidth) / 2;
            const roadRight = roadLeft + roadWidth;
            player.x = Math.max(roadLeft + player.width/2, Math.min(roadRight - player.width/2, player.x));

            // Update road
            roadOffset += speed * 0.1;

            // Update traffic
            trafficSpawnTimer++;
            if (trafficSpawnTimer > 120 - (speed / 2) && speed > 50) {
                spawnTraffic();
                trafficSpawnTimer = 0;
            }

            for (let i = traffic.length - 1; i >= 0; i--) {
                const car = traffic[i];
                car.y += (speed - car.speed) * 0.1;

                // Remove cars that are behind
                if (car.y > canvas.height + 100) {
                    traffic.splice(i, 1);
                    score += 10;
                    continue;
                }

                // Collision detection
                if (Math.abs(player.x - car.x) < (player.width + car.width) / 2 &&
                    Math.abs(player.y - car.y) < (player.height + car.height) / 2) {
                    gameOver();
                }
            }

            // Score based on speed
            score += Math.floor(speed / 100);

            // Update UI
            document.getElementById('speed').textContent = Math.floor(speed);
            document.getElementById('scoreValue').textContent = score;
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
            skyGradient.addColorStop(0, '#0f0f23');
            skyGradient.addColorStop(1, '#1a1a3e');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

            // Draw road
            const roadLeft = (canvas.width - roadWidth) / 2;
            const roadRight = roadLeft + roadWidth;

            // Road surface
            ctx.fillStyle = '#2a2a3e';
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Road edges
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(roadLeft - 5, 0, 5, canvas.height);
            ctx.fillRect(roadRight, 0, 5, canvas.height);

            // Lane markings
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([30, 30]);
            
            for (let i = 1; i < laneCount; i++) {
                const x = roadLeft + (laneWidth * i);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Animate lane markings
            ctx.save();
            ctx.translate(0, roadOffset % 60);
            ctx.restore();

            // Draw traffic
            for (const car of traffic) {
                drawCar(car.x, car.y, car.width, car.height, car.color, false);
            }

            // Draw player car
            drawCar(player.x, player.y, player.width, player.height, player.color, true);

            // Speed lines effect
            if (speed > 100) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 10; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + 50 + speed);
                    ctx.stroke();
                }
            }
        }

        function drawCar(x, y, width, height, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Car body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-width/2, height/2);
            ctx.lineTo(-width/2, -height/4);
            ctx.lineTo(-width/3, -height/2);
            ctx.lineTo(width/3, -height/2);
            ctx.lineTo(width/2, -height/4);
            ctx.lineTo(width/2, height/2);
            ctx.closePath();
            ctx.fill();

            // Car top
            ctx.fillStyle = isPlayer ? '#333' : '#444';
            ctx.beginPath();
            ctx.moveTo(-width/3, -height/4);
            ctx.lineTo(-width/4, -height/2 + 5);
            ctx.lineTo(width/4, -height/2 + 5);
            ctx.lineTo(width/3, -height/4);
            ctx.closePath();
            ctx.fill();

            // Windshield
            ctx.fillStyle = '#88ccff';
            ctx.beginPath();
            ctx.moveTo(-width/4, -height/3);
            ctx.lineTo(-width/5, -height/2 + 8);
            ctx.lineTo(width/5, -height/2 + 8);
            ctx.lineTo(width/4, -height/3);
            ctx.closePath();
            ctx.fill();

            // Headlights
            ctx.fillStyle = '#ffffaa';
            ctx.beginPath();
            ctx.arc(-width/3, -height/2 + 5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(width/3, -height/2 + 5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Taillights
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(-width/3, height/2 - 5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(width/3, height/2 - 5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Wheels
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(-width/2 - 3, -height/4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(width/2 + 3, -height/4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-width/2 - 3, height/3, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(width/2 + 3, height/3, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            gameRunning = true;
            score = 0;
            speed = 0;
            player.x = canvas.width / 2;
            traffic = [];
            trafficSpawnTimer = 0;
            document.getElementById('gameOver').style.display = 'none';
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize
        initRoad();
        gameLoop();
    </script>
</body>
</html>
