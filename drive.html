<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSN Drive - 3D Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
#gameCanvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;width:100%;padding:20px;color:#fff;pointer-events:none;z-index:10}
#speedometer{position:fixed;bottom:30px;right:30px;text-align:right}
#speed{font-size:4rem;font-weight:bold;color:#0f0;text-shadow:0 0 20px rgba(0,255,0,0.5)}
#speedLabel{font-size:1rem;color:#888}
#score{position:fixed;top:30px;left:30px;font-size:1.5rem}
#controls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:#888;font-size:0.9rem}
#gameOver{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;display:none;background:rgba(0,0,0,0.9);padding:40px;border-radius:20px;border:2px solid #f44}
#gameOver h2{font-size:3rem;color:#f44;margin-bottom:20px}
#restartBtn{margin-top:20px;padding:15px 40px;font-size:1.2rem;background:#f44;color:#fff;border:none;border-radius:10px;cursor:pointer;pointer-events:all}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
<div id="score">Score: <span id="scoreValue">0</span></div>
<div id="speedometer"><div id="speed">0</div><div id="speedLabel">MPH</div></div>
<div id="controls">Arrow keys to drive | R = Restart</div>
</div>
<div id="gameOver"><h2>CRASH!</h2><p>Final Score: <span id="finalScore">0</span></p><button id="restartBtn" onclick="restartGame()">RESTART</button></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const canvas=document.getElementById('gameCanvas');

// Scene with sunset fog
const scene=new THREE.Scene();
const fogColor=new THREE.Color(0x4a2030);
scene.fog=new THREE.Fog(fogColor,30,220);
scene.background=fogColor;

// Camera
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,4.5,9);

// Renderer
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.8;

// Ambient + sunset sun
const ambient=new THREE.AmbientLight(0xffaa66,0.8);
scene.add(ambient);

const hemi=new THREE.HemisphereLight(0xff8844,0x442266,0.6);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xff6622,3.5);
sun.position.set(40,35,-100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60;
sun.shadow.camera.right=60;
sun.shadow.camera.top=60;
sun.shadow.camera.bottom=-60;
sun.shadow.camera.near=1;
sun.shadow.camera.far=300;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

// Rim light for dramatic car edges
const rimLight=new THREE.DirectionalLight(0x8866ff,1.2);
rimLight.position.set(-40,10,20);
scene.add(rimLight);

// Sky dome gradient
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,32),new THREE.ShaderMaterial({
uniforms:{top:{value:new THREE.Color(0x201050)},mid:{value:new THREE.Color(0x992255)},bot:{value:new THREE.Color(0xff8800)}},
vertexShader:'varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
fragmentShader:'uniform vec3 top,mid,bot;varying vec3 v;void main(){float y=normalize(v).y;vec3 c=mix(bot,mid,smoothstep(-0.2,0.3,y));c=mix(c,top,smoothstep(0.3,0.8,y));gl_FragColor=vec4(c,1.0);}',
side:THREE.BackSide
}));
scene.add(sky);

// Sun glow
const sunSprite=new THREE.Mesh(new THREE.SphereGeometry(10,32,32),new THREE.MeshBasicMaterial({color:0xffaa00}));
sunSprite.position.set(40,12,-140);
scene.add(sunSprite);
const sunGlow=new THREE.Mesh(new THREE.SphereGeometry(30,32,32),new THREE.MeshBasicMaterial({color:0xff6600,transparent:true,opacity:0.35}));
sunGlow.position.copy(sunSprite.position);
scene.add(sunGlow);

// Clean road: raised asphalt with curbs
const roadGroup=new THREE.Group();
const asphalt=new THREE.Mesh(new THREE.PlaneGeometry(14,500),new THREE.MeshStandardMaterial({color:0x333333,roughness:0.9}));
asphalt.rotation.x=-Math.PI/2;asphalt.receiveShadow=true;roadGroup.add(asphalt);

const curbMat=new THREE.MeshStandardMaterial({color:0xcc3333,roughness:0.6});
const curbLeft=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.2,500),curbMat);
curbLeft.position.set(-7.2,0.1,0);curbLeft.castShadow=true;curbLeft.receiveShadow=true;roadGroup.add(curbLeft);
const curbRight=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.2,500),curbMat);
curbRight.position.set(7.2,0.1,0);curbRight.castShadow=true;curbRight.receiveShadow=true;roadGroup.add(curbRight);

const shoulderMat=new THREE.MeshStandardMaterial({color:0x332211,roughness:1});
const shoulderLeft=new THREE.Mesh(new THREE.PlaneGeometry(4,500),shoulderMat);
shoulderLeft.rotation.x=-Math.PI/2;shoulderLeft.position.set(-9.4,-0.05,0);shoulderLeft.receiveShadow=true;roadGroup.add(shoulderLeft);
const shoulderRight=new THREE.Mesh(new THREE.PlaneGeometry(4,500),shoulderMat);
shoulderRight.rotation.x=-Math.PI/2;shoulderRight.position.set(9.4,-0.05,0);shoulderRight.receiveShadow=true;roadGroup.add(shoulderRight);

scene.add(roadGroup);

// Lane markings
const marks=[];
const markMat=new THREE.MeshBasicMaterial({color:0xffffff});
for(let i=0;i<40;i++){
const m=new THREE.Mesh(new THREE.PlaneGeometry(0.25,5),markMat);
m.rotation.x=-Math.PI/2;m.position.y=0.02;m.position.z=-i*14;
roadGroup.add(m);marks.push(m);
}

// Scenery pool: rocks, cacti, light poles
const scenery=[];
const rockGeo=new THREE.DodecahedronGeometry(1,0);
const rockMat=new THREE.MeshStandardMaterial({color:0x553322,roughness:0.9});
const cactusGeo=new THREE.CapsuleGeometry(0.4,2,4,8);
const cactusMat=new THREE.MeshStandardMaterial({color:0x226622,roughness:0.8});
const poleGeo=new THREE.CylinderGeometry(0.08,0.08,6,8);
const poleMat=new THREE.MeshStandardMaterial({color:0x444444,metalness:0.7,roughness:0.3});
const lightGeo=new THREE.BoxGeometry(0.5,0.2,0.2);
const lightMat=new THREE.MeshBasicMaterial({color:0xffffaa});

function makeScenery(z){
const side=Math.random()>0.5?1:-1;
const x=(9+Math.random()*15)*side;
const type=Math.random();
let obj;
if(type<0.45){
obj=new THREE.Mesh(rockGeo,rockMat);
const s=1+Math.random()*2;
obj.scale.set(s,s,s);obj.position.set(x,s*0.5,z);
}else if(type<0.75){
obj=new THREE.Mesh(cactusGeo,cactusMat);
const s=0.8+Math.random()*1.2;
obj.scale.set(s,s,s);obj.position.set(x,s,z);
}else{
obj=new THREE.Group();
const pole=new THREE.Mesh(poleGeo,poleMat);
pole.position.y=3;obj.add(pole);
const arm=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,2),poleMat);
arm.position.set(-0.7*side,5.8,0);obj.add(arm);
const light=new THREE.Mesh(lightGeo,lightMat);
light.position.set(-1.3*side,5.8,0);obj.add(light);
const spot=new THREE.PointLight(0xffffaa,1,15);
spot.position.set(-1.3*side,5.5,0);obj.add(spot);
obj.position.set(x,0,z);
}
obj.castShadow=true;obj.receiveShadow=true;
scene.add(obj);scenery.push(obj);
}

for(let i=0;i<30;i++)makeScenery(-10-i*12);

// Car builder with nicer shape
function makeCar(color,hasHeadlights=false){
const car=new THREE.Group();

// Lower body
const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.55,4),new THREE.MeshStandardMaterial({color:color,metalness:0.65,roughness:0.25}));
body.position.y=0.6;body.castShadow=true;car.add(body);

// Upper cabin
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.5,2.2),new THREE.MeshStandardMaterial({color:0x111111,metalness:0.7,roughness:0.2}));
cabin.position.set(0,1.05,-0.3);cabin.castShadow=true;car.add(cabin);

// Glass
const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.3,0.35),new THREE.MeshStandardMaterial({color:0x3366aa,metalness:0.9,roughness:0.05,transparent:true,opacity:0.7}));
glass.position.set(0,1.1,0.81);glass.rotation.x=-0.1;car.add(glass);

// Spoiler
const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.1,0.6),new THREE.MeshStandardMaterial({color:color,metalness:0.5,roughness:0.3}));
spoiler.position.set(0,1.0,-1.8);car.add(spoiler);

// Wheels
const wGeo=new THREE.CylinderGeometry(0.35,0.35,0.3,20);
const wMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.9});
[[-0.95,0.35,1.1],[0.95,0.35,1.1],[-0.95,0.35,-1.1],[0.95,0.35,-1.1]].forEach(p=>{
const w=new THREE.Mesh(wGeo,wMat);w.rotation.z=Math.PI/2;w.position.set(...p);w.castShadow=true;car.add(w);
});

if(hasHeadlights){
const hlMat=new THREE.MeshBasicMaterial({color:0xffffcc});
[[-0.6,0.55,2.0],[0.6,0.55,2.0]].forEach(p=>{
const hl=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,12),hlMat);hl.position.set(...p);car.add(hl);
});
const sl=new THREE.SpotLight(0xffffcc,3,45,0.5,0.4,1);
sl.position.set(0,0.8,2.2);sl.target.position.set(0,0,10);car.add(sl);car.add(sl.target);
}

// Tail lights
const tlMat=new THREE.MeshBasicMaterial({color:0xff0000});
[[-0.6,0.55,-2.0],[0.6,0.55,-2.0]].forEach(p=>{
const tl=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.12,0.05),tlMat);tl.position.set(...p);car.add(tl);
});

return car;
}

const player=makeCar(0xff3333,true);
scene.add(player);

// Traffic
let traffic=[];
const colors=[0x4488ff,0xffaa00,0xff44ff,0x44ff88,0xffffff,0xff6666];
function spawnTraffic(){
const lane=(Math.floor(Math.random()*3)-1)*4.5;
const car=makeCar(colors[Math.floor(Math.random()*colors.length)],false);
car.position.set(lane,0,-90-Math.random()*50);
car.userData.speed=45+Math.random()*55;
scene.add(car);traffic.push(car);
}

// Game state
let gameRunning=true,score=0,speed=0,maxSpeed=200,dist=0,roadCurve=0,curveTarget=0;
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='r'||e.key==='R')restartGame();});
window.addEventListener('keyup',e=>keys[e.key]=false);
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

// Speed particles
const particleGeo=new THREE.BufferGeometry();
const particleCount=200;
const posArr=new Float32Array(particleCount*3);
for(let i=0;i<particleCount*3;i++)posArr[i]=(Math.random()-0.5)*30;
particleGeo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
const particleMat=new THREE.PointsMaterial({color:0xffffaa,size:0.15,transparent:true,opacity:0.6});
const particles=new THREE.Points(particleGeo,particleMat);
particles.position.set(0,2,-10);scene.add(particles);

function update(dt){
if(!gameRunning)return;

// Speed control
if(keys['ArrowUp']||keys['w']||keys['W'])speed+=45*dt;
else if(keys['ArrowDown']||keys['s']||keys['S'])speed-=90*dt;
else speed-=22*dt;
speed=Math.max(0,Math.min(speed,maxSpeed));

// Steering with body lean
let steer=0;
if(speed>5){
if(keys['ArrowLeft']||keys['a']||keys['A']){player.position.x-=16*dt;steer=0.12;}
if(keys['ArrowRight']||keys['d']||keys['D']){player.position.x+=16*dt;steer=-0.12;}
}
player.position.x=Math.max(-6.2,Math.min(6.2,player.position.x));
player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,steer,0.12);
player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,steer*0.4,0.06);

// Move world
const move=speed*dt;
dist+=move;
roadCurve+=(curveTarget-roadCurve)*0.02;
curveTarget=Math.sin(dist*0.008)*2.5;

// Road markings
marks.forEach(m=>{m.position.z+=move;if(m.position.z>10)m.position.z-=560;});

// Scenery
scenery.forEach(s=>{s.position.z+=move;if(s.position.z>15){s.position.z-=360;makeScenery(s.position.z);scene.remove(s);scenery.splice(scenery.indexOf(s),1);}});

// Traffic
if(Math.random()<0.018*speed/maxSpeed)spawnTraffic();
for(let i=traffic.length-1;i>=0;i--){
const c=traffic[i];
c.position.z+=move-c.userData.speed*dt;
if(c.position.z>10){scene.remove(c);traffic.splice(i,1);score+=Math.floor(speed/8);continue;}
if(Math.abs(player.position.x-c.position.x)<1.8&&Math.abs(player.position.z-c.position.z)<3.2)gameOver();
}

score+=Math.floor(speed/45);
document.getElementById('speed').textContent=Math.floor(speed);
document.getElementById('scoreValue').textContent=score;

// Camera follow
const targetX=player.position.x*0.35+roadCurve*2;
camera.position.x=THREE.MathUtils.lerp(camera.position.x,targetX,0.05);
camera.position.z=player.position.z+8.5;
camera.position.y=4.5+speed/maxSpeed*0.5;
camera.lookAt(player.position.x*0.2,0.5,player.position.z-25);

// Speed particles
const positions=particles.geometry.attributes.position.array;
for(let i=0;i<particleCount;i++){
positions[i*3+2]+=move*2+0.5;
if(positions[i*3+2]>10){positions[i*3+2]=-30;positions[i*3]=(Math.random()-0.5)*20;positions[i*3+1]=(Math.random()-0.5)*10;}
}
particles.geometry.attributes.position.needsUpdate=true;
particles.visible=speed>60;

roadGroup.position.z=player.position.z-50;
}

function gameOver(){gameRunning=false;document.getElementById('finalScore').textContent=score;document.getElementById('gameOver').style.display='block';}
function restartGame(){
gameRunning=true;score=0;speed=0;dist=0;roadCurve=0;curveTarget=0;
player.position.set(0,0,0);player.rotation.set(0,0,0);
traffic.forEach(c=>scene.remove(c));traffic=[];
document.getElementById('gameOver').style.display='none';
}
window.restartGame=restartGame;

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);update(clock.getDelta());renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
